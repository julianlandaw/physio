<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three-compartment model browser checks</title>
</head>
<body data-result="running">
  <h1>Three-compartment model browser checks</h1>
  <pre id="results">Running…</pre>
  <iframe id="app" title="Simulation under test" src="../docs/Pharmacology/threecompartmentmodel.html" hidden></iframe>
  <script>
    const results = document.getElementById('results');
    const checks = [];
    const approx = (actual, expected, tolerance = 1e-7) =>
      Number.isFinite(actual) && Math.abs(actual - expected) <= tolerance;
    function check(name, condition) {
      checks.push({ name, passed: Boolean(condition) });
      if (!condition) throw new Error(name);
    }

    document.getElementById('app').addEventListener('load', async () => {
      const app = document.getElementById('app').contentWindow;
      const input = id => app.document.getElementById(id);
      const unit = { factor: 1, perKg: true };
      const pk = { V1: 1, V2: 0, V3: 0, k10: 1, k12: 0, k21: 0, k13: 0, k31: 0 };
      const run = (plan, finalTime = 0.15) => app.simulatePkModel({
        pk, ke0: 0, initialConcentration: 0, finalTime,
        dosingPlan: plan, tci: { enabled: false }
      });
      const plan = basic => app.buildDosingPlan({ schedule: null, basic, bolusUnit: unit, infusionUnit: unit, weightKg: 70 });

      try {
        const instant = run(plan({ bolus: 1, tbolus: 0, infusion: 0, tinfusion: 0 }));
        check('instant bolus delivers full dose', approx(instant.totalDoseMgKg, 1));
        check('instant bolus changes Cp at time zero', approx(instant.cp[0], 1));
        check('final step ends at requested time', approx(instant.ts.at(-1), 0.15));
        check('one-compartment analytical decay', approx(instant.cp.at(-1), Math.exp(-0.15)));

        const short = run(plan({ bolus: 1, tbolus: 0.05, infusion: 0, tinfusion: 0 }));
        check('short loading dose delivers exactly one dose', approx(short.totalDoseMgKg, 1));
        check('short loading dose follows analytical solution',
          approx(short.cp.at(-1), 20 * (1 - Math.exp(-0.05)) * Math.exp(-0.1)));

        const scheduled = app.buildDosingPlan({
          schedule: { enabled: true, boluses: [{ time: 0, dose: 1, duration: 0.05 }], infusions: [] },
          basic: {}, bolusUnit: unit, infusionUnit: unit, weightKg: 70
        });
        check('basic and scheduled dosing agree', approx(run(scheduled).cp.at(-1), short.cp.at(-1)));
        const overlapping = app.buildDosingPlan({
          schedule: { enabled: true, boluses: [], infusions: [
            { start: 0, end: 0.15, rate: 1 }, { start: 0.05, end: 0.1, rate: 2 }
          ] }, basic: {}, bolusUnit: unit, infusionUnit: unit, weightKg: 70
        });
        check('overlapping infusion rates add', approx(run(overlapping).totalDoseMgKg, 0.25));
        check('delivery is clipped at the final time',
          approx(run(plan({ bolus: 1, tbolus: 1, infusion: 0, tinfusion: 0 }), 0.05).totalDoseMgKg, 0.05));
        const absolute = app.buildDosingPlan({
          schedule: null,
          basic: { bolus: 70, tbolus: 0, infusion: 0, tinfusion: 0 },
          bolusUnit: { factor: 1, perKg: false }, infusionUnit: unit, weightKg: 70
        });
        check('absolute bolus uses patient weight', approx(run(absolute).totalDoseMgKg, 1));

        const change = (id, value) => {
          input(id).value = value;
          input(id).dispatchEvent(new Event('change', { bubbles: true }));
        };
        const lastValidPlot = input('myDiv1').data;
        change('mainBolusAmount', '');
        check('empty main dose stays incomplete and leaves results unchanged', input('b').value === '' && input('myDiv1').data === lastValidPlot && !input('mainBolusAmountError').hidden);
        input('darkModeBtnTop').click();
        check('invalid dose survives display changes', input('mainBolusAmount').value === '' && input('simulationStatus').dataset.state === 'error');
        input('darkModeBtnTop').click();
        input('dosingModeTci').click();
        input('dosingModeBasic').click();
        check('incomplete basic entries remain editable after switching modes', !input('mainBolusAmount').disabled && input('mainBolusAmount').value === '');
        change('mainBolusAmount', '0');
        check('explicit zero dose is accepted', input('b').value === '0' && input('mainValidationSummary').hidden && !input('mainBolusAmount').hasAttribute('aria-invalid'));
        change('mainWeight', '75');
        change('mainLoadingDuration', '0.25');
        change('mainInfusionDuration', '30');
        change('mainFinalTime', '60');
        check('main timing and patient fields update model inputs', input('weight').value === '75' && input('tbolus').value === '0.25' && input('tinfusion').value === '30' && input('tfinal').value === '60');
        input('dosingModeTci').click();
        check('main mode selector enables TCI and shows its settings', input('tciEnabled').checked && !input('useSchedule').checked && !input('mainTciControls').hidden && input('mainManualControls').hidden);
        check('TCI summary includes the maximum rate value', input('summaryDose').textContent.includes('maximum 200'));
        input('dosingModeSchedule').click();
        check('main schedule mode is exclusive and exposes editing actions', input('useSchedule').checked && !input('tciEnabled').checked && !input('mainScheduleControls').hidden);
        input('dosingModeBasic').click();
        check('returning to basic mode restores timing controls', !input('useSchedule').checked && !input('tciEnabled').checked && !input('mainLoadingDuration').closest('label').hidden);
        change('Vd1', '0');
        check('advanced errors appear on the main workspace', !input('mainValidationSummary').hidden && input('mainInputErrors').textContent.includes('V1'));
        input('reviewInvalidInputsBtn').click();
        check('review errors opens the relevant settings section', !input('paramsDrawer').inert && input('volumeCardBody').style.display === 'block');
        input('drawerCloseBtn').click();
        check('closed settings drawer becomes inert', input('paramsDrawer').inert);
        app.reset();

        await app.Plotly.relayout('myDiv1', { 'xaxis.range': [0, 10], 'xaxis.autorange': false });
        change('mainBolusAmount', '1.5');
        check('dose edits preserve the chart time window', approx(input('myDiv1')._fullLayout.xaxis.range[0], 0) && approx(input('myDiv1')._fullLayout.xaxis.range[1], 10));
        app.setChartWindow('60');
        check('quick chart windows update the time axis', approx(input('myDiv1')._fullLayout.xaxis.range[1], 60));
        app.reset();
        check('reset clears a previous chart zoom', input('myDiv1')._fullLayout.xaxis.range[1] > 60);
        check('therapeutic references have a separate readable key', !input('therapeuticRangeKey').hidden && input('myDiv1').data.length === 2);

        input('darkModeBtnTop').click();
        check('dark mode themes the concentration plots', input('myDiv1')._fullLayout.paper_bgcolor === '#121212' && input('myDiv2')._fullLayout.plot_bgcolor === '#1e1e1e');
        input('darkModeBtnTop').click();
        check('light mode restores plot colors', input('myDiv1')._fullLayout.paper_bgcolor === '#ffffff');
        input('scaleToggleBtnTop').click();
        app.dfsolve();
        check('log axis survives a simulation redraw', input('myDiv1')._fullLayout.yaxis.type === 'log' && input('myDiv2')._fullLayout.yaxis.type === 'log' && input('scaleToggleBtnTop').textContent === 'Linear Y-axis');
        input('scaleToggleBtnTop').click();
        check('linear axis can be restored', input('myDiv1')._fullLayout.yaxis.type === 'linear');

        const originalNewPlot = app.Plotly.react;
        let plotCalls = 0;
        app.Plotly.react = function (...args) { plotCalls++; return originalNewPlot.apply(this, args); };
        app.reset();
        check('reset renders once after loading the preset', plotCalls === 3);
        plotCalls = 0;
        app.propofol();
        check('direct preset calls still render', plotCalls === 3);
        plotCalls = 0;

        input('b').value = 5;
        input('initialp').value = 2;
        input('tciEnabled').checked = true;
        app.applyDrugById('fentanyl');
        check('drug switch renders once after loading the example', plotCalls === 3);
        app.Plotly.react = originalNewPlot;
        check('drug switch replaces prior dose with fentanyl example', input('b').value === '1' && input('infusion').value === '1' && input('initialp').value === '0');
        check('drug switch permits manual TCI without a starting profile', !input('tciEnabled').checked && !input('tciEnabled').disabled);
        check('uncurated TCI target and rate are blank', input('tciTarget').value === '' && input('tciMaxRate').value === '' && input('tciTargetType').value === 'cp');
        input('tciEnabled').checked = true;
        input('tciEnabled').dispatchEvent(new Event('change', { bubbles: true }));
        check('manual TCI requires both inputs', !app.validateSimulationInputs() && input('tciTarget').classList.contains('is-invalid') && input('tciMaxRate').classList.contains('is-invalid'));
        check('TCI input errors are visible beside main controls', !input('mainTciControls').hidden && input('dosingModeTci').checked && input('mainTciTarget').getAttribute('aria-invalid') === 'true');
        change('mainTciTarget', '2');
        change('mainTciMaxRate', '1');
        check('manual TCI runs after both inputs are supplied', app.validateSimulationInputs() && app.simulateStrategy(app.getCurrentState()).totalDoseMgKg > 0);
        app.dfsolve();
        input('darkModeBtnTop').click();
        check('dark mode also themes the TCI rate plot', input('tciRatePlot')._fullLayout.paper_bgcolor === '#121212');
        input('darkModeBtnTop').click();
        app.captureCurrentStrategy();
        const manualTciId = app.eval('strategies.at(-1).id');
        app.applyDrugById('propofol');
        let restoredPlotCalls = 0;
        app.Plotly.react = function (...args) { restoredPlotCalls++; return originalNewPlot.apply(this, args); };
        app.loadStrategyToInputs(manualTciId);
        app.Plotly.react = originalNewPlot;
        check('restoring a TCI strategy renders once', restoredPlotCalls === 4);
        check('manual TCI strategy restores entered settings', input('tciEnabled').checked && input('tciTarget').value === '2' && input('tciMaxRate').value === '1');
        input('scaleToggleBtnTop').click();
        input('compareMode').checked = true;
        input('compareMode').dispatchEvent(new Event('change', { bubbles: true }));
        check('log scale persists in strategy comparison', input('myDiv1')._fullLayout.yaxis.type === 'log');
        check('strategy comparison still reports calculated metrics', input('compareResults').querySelectorAll('tbody tr').length === 2 && input('compareResults').textContent.includes('AUC Cp'));
        input('darkModeBtnTop').click();
        check('dark theme applies in strategy comparison', input('myDiv1')._fullLayout.paper_bgcolor === '#121212');
        input('darkModeBtnTop').click();
        input('compareMode').checked = false;
        input('compareMode').dispatchEvent(new Event('change', { bubbles: true }));
        input('scaleToggleBtnTop').click();
        check('every drug has an explicit example decision', app.eval('DRUGS.every(drug => Object.hasOwn(DRUG_DOSE_EXAMPLES, drug.id))'));

        app.applyDrugById('dexmedetomidine');
        check('dexmedetomidine example uses its own dose units', input('b').value === '1' && input('tbolus').value === '10' && input('infusion').value === '0.5' && input('infusionUnitSelect').value === 'µg/kg/hr');
        app.applyDrugById('ephedrine');
        check('bolus-only example clears prior infusion', input('b').value === '0.1' && input('infusion').value === '0');
        app.applyDrugById('bupivacaine');
        check('bupivacaine does not suggest an IV regimen', input('b').value === '0' && input('infusion').value === '0');
        check('bupivacaine TCI is available with a route warning', !input('tciEnabled').disabled && input('tciPresetNote').textContent.includes('no routine IV'));
        app.applyDrugById('vasopressin');
        check('vasopressin does not imply a mass-to-unit conversion', input('b').value === '0' && input('infusion').value === '0');
        check('vasopressin TCI is available with a unit warning', !input('tciEnabled').disabled && input('tciPresetNote').textContent.includes('units/min'));

        app.applyDrugById('propofol');
        check('propofol example is preserved on drug selection', input('b').value === '1' && input('infusion').value === '100');
        input('Vd1').value = 229;
        input('Vd1').dispatchEvent(new Event('change', { bubbles: true }));
        check('edited PK is marked modified', input('summaryDrug').textContent.includes('modified'));
        check('modified preset hides therapeutic bands', app.buildTherapeuticShapes(10).shapes.length === 0);

        app.applyDrugById('lidocaine');
        check('absent effect-site model is labeled unavailable', input('keyFinalCe').textContent === 'Not modeled');
        input('b').value = 1;
        input('tbolus').value = 0;
        input('infusion').value = 0;
        input('tinfusion').value = 0;
        app.dfsolve();
        check('isolated bolus has no context-sensitive half-time', input('keyContextHalfLife').textContent === 'N/A');
        input('tciEnabled').checked = true;
        input('tciTargetType').value = 'ce';
        input('tciTarget').value = 2;
        input('tciMaxRate').value = 1;
        check('effect-site TCI still requires ke0', !app.validateSimulationInputs() && input('ke0').classList.contains('is-invalid'));

        app.applyDrugById('propofol');
        input('tciEnabled').checked = true;
        input('tciEnabled').dispatchEvent(new Event('change', { bubbles: true }));
        input('tfinal').value = 2;
        input('tciStopTime').value = 1.35;
        input('tciTarget').value = '';
        input('importTciScheduleBtn').click();
        check('invalid TCI cannot replace the dosing schedule', input('tciEnabled').checked && !input('useSchedule').checked && input('tciTarget').classList.contains('is-invalid'));
        input('tciTarget').value = 2;
        const sourceTci = app.simulateStrategy(app.getCurrentState());
        check('main TCI view offers schedule import', !input('mainImportTciScheduleBtn').hidden);
        input('mainImportTciScheduleBtn').click();
        const importedSchedule = app.getScheduleFromDOM();
        const replay = app.simulateStrategy(app.getCurrentState());
        check('TCI import activates an editable schedule and turns TCI off', importedSchedule.enabled && !input('tciEnabled').checked && input('b').disabled && input('mainImportTciScheduleBtn').hidden);
        check('TCI import updates the main mode selector', input('dosingModeSchedule').checked);
        check('imported schedule keeps its rate chart visible', !input('tciRatePanel').hidden && input('deliveryRateHeading').textContent.includes('Scheduled'));
        check('TCI import preserves the stop boundary without adding a bolus', importedSchedule.boluses.length === 0 && importedSchedule.infusions.length > 0 && approx(importedSchedule.infusions.at(-1).end, 1.35));
        check('TCI schedule reproduces total dose', approx(replay.totalDoseMgKg, sourceTci.totalDoseMgKg));
        check('TCI schedule reproduces Cp and Ce', replay.cp.every((value, index) => approx(value, sourceTci.cp[index])) && replay.ce.every((value, index) => approx(value, sourceTci.ce[index])));
        check('imported fractional inputs are valid', [...input('infusionEventsTable').querySelectorAll('input[type="number"]')].every(el => !el.validity.stepMismatch));
        check('original TCI replay comparison is visible', !input('tciReplayComparison').hidden && input('tciReplayMetrics').textContent.includes('Cp') && input('tciSourceDescription').textContent.includes('Propofol'));
        check('original TCI Cp overlay is plotted', input('myDiv1').data.some(trace => trace.name === 'Original TCI Cp (model)'));
        input('showTciReference').checked = false;
        input('showTciReference').dispatchEvent(new Event('change', { bubbles: true }));
        check('original TCI overlay can be hidden', !input('myDiv1').data.some(trace => trace.name === 'Original TCI Cp (model)'));
        input('showTciReference').checked = true;
        input('showTciReference').dispatchEvent(new Event('change', { bubbles: true }));
        input('tciSimplifyLimit').value = '4';
        input('simplifyTciScheduleBtn').click();
        const simplified = app.getScheduleFromDOM();
        check('optional simplified schedule honors segment limit', simplified.infusions.length <= 4);
        check('simplification approximately preserves total dose', approx(app.simulateStrategy(app.getCurrentState()).totalDoseMgKg, sourceTci.totalDoseMgKg, 1e-6));
        check('simplified replay reports model deviation', input('tciReplayMetrics').textContent.includes('Ce') && input('tciReplayMetrics').textContent.includes('dose difference'));
        input('restoreExactTciScheduleBtn').click();
        check('exact original schedule can be restored', JSON.stringify(app.getScheduleFromDOM()) === JSON.stringify(importedSchedule));
        change('mainInfusionRate', '');
        check('scheduled quick edits also reject blank rates', !input('mainInfusionRateError').hidden && !input('mainValidationSummary').hidden);
        change('mainInfusionRate', String(importedSchedule.infusions[0].rate));
        check('corrected quick schedule edits preserve original regimen', JSON.stringify(app.getScheduleFromDOM()) === JSON.stringify(importedSchedule));
        input('importTciScheduleBtn').click();
        check('TCI import requires active TCI', JSON.stringify(app.getScheduleFromDOM()) === JSON.stringify(importedSchedule));
        const firstRateInput = input('infusionEventsTable').querySelector('input[data-field="rate"]');
        firstRateInput.value = String(Number(firstRateInput.value) * 1.5);
        firstRateInput.dispatchEvent(new Event('input', { bubbles: true }));
        check('editing imported rate changes the predicted curve', !approx(app.simulateStrategy(app.getCurrentState()).cp.at(-1), sourceTci.cp.at(-1)));
        firstRateInput.dispatchEvent(new Event('change', { bubbles: true }));
        check('replay comparison updates after a schedule edit', input('tciReplayMetrics').textContent.includes('Maximum model replay difference'));
        input('weight').value = '75';
        app.dfsolve();
        check('comparison flags changed model assumptions', input('tciReplayWarning').textContent.includes('weight'));
        input('tfinal').value = '1';
        app.dfsolve();
        check('original overlay stops at the current simulation horizon', input('myDiv1').data.find(trace => trace.name === 'Original TCI Cp (model)').x.at(-1) <= 1);
        input('undoTciImportBtn').click();
        check('undo import restores original TCI settings', input('tciEnabled').checked && !input('useSchedule').checked && input('tciTarget').value === '2' && input('tciStopTime').value === '1.35' && input('tfinal').value === '2' && input('weight').value === '70');
        check('undo import removes frozen comparison', input('tciReplayComparison').hidden && input('tciSimplifyTools').hidden);

        app.applyDrugById('remifentanil');
        input('tciEnabled').checked = true;
        input('tciEnabled').dispatchEvent(new Event('change', { bubbles: true }));
        input('tfinal').value = 2;
        input('tciStopTime').value = 1.35;
        const effectSiteTci = app.simulateStrategy(app.getCurrentState());
        input('importTciScheduleBtn').click();
        const effectSiteReplay = app.simulateStrategy(app.getCurrentState());
        check('effect-site TCI import preserves Ce and dose',
          approx(effectSiteReplay.totalDoseMgKg, effectSiteTci.totalDoseMgKg) &&
          effectSiteReplay.ts.every((time, index) => {
            const sourceIndex = effectSiteTci.ts.findIndex(sourceTime => approx(sourceTime, time));
            return sourceIndex >= 0 && approx(effectSiteReplay.ce[index], effectSiteTci.ce[sourceIndex]);
          }));

        app.applyDrugById('propofol');
        input('tciEnabled').checked = true;
        input('tciEnabled').dispatchEvent(new Event('change', { bubbles: true }));
        input('tfinal').value = 255;
        input('tciStopTime').value = 255;
        const tciState = app.getCurrentState();
        const tciSimulation = app.simulateStrategy(tciState);
        check('saved-state TCI simulation includes delivered dose', tciSimulation.totalDoseMgKg > 0);
        check('saved state includes TCI and concentration unit', tciState.tci.enabled && tciState.units.conc === 'µg/mL');
        input('b').value = '';
        input('infusion').value = '';
        check('inactive basic dosing fields do not block TCI', app.validateSimulationInputs());
        app.captureCurrentStrategy();
        const savedId = app.eval('strategies.at(-1).id');
        app.applyDrugById('fentanyl');
        app.loadStrategyToInputs(savedId);
        check('loading strategy restores TCI and display units', input('tciEnabled').checked && input('currentDrugLabel').textContent.includes('µg/mL'));
        check('blank inactive dose inputs restore as zero', input('b').value === '0' && input('infusion').value === '0');
        input('useSchedule').checked = true;
        input('useSchedule').dispatchEvent(new Event('change', { bubbles: true }));
        check('enabling schedule turns off TCI', !input('tciEnabled').checked);

        app.applyDrugById('propofol');
        app.onecompartment();
        input('Vd1').value = 1;
        input('Cl').value = 1;
        input('b').value = 0;
        input('tbolus').value = 0;
        input('infusion').value = 1000;
        input('tinfusion').value = 1;
        input('tfinal').value = 2;
        app.dfsolve();
        check('one-compartment post-infusion half-time is ln(2)',
          approx(Number(input('keyContextHalfLife').textContent), Math.log(2), 0.001));
        check('steady-state display is unavailable after infusion stops', input('psshtml').textContent === 'N/A');
        input('tfinal').value = 0.5;
        app.dfsolve();
        check('steady-state display uses the active final rate', approx(Number(input('psshtml').textContent), 1000));

        app.setScheduleToDOM({
          enabled: true,
          boluses: [{ time: 0.025, dose: 1, duration: 0 }],
          infusions: [{ start: 0.05, end: 0.15, rate: 1000 }]
        });
        app.disableLegacyBolusInfusionInputs(true);
        app.dfsolve();
        app.captureCurrentStrategy();
        const scheduleId = app.eval('strategies.at(-1).id');
        app.applyDrugById('fentanyl');
        app.loadStrategyToInputs(scheduleId);
        check('loading schedule disables ignored basic fields', input('useSchedule').checked && input('b').disabled);
        check('loading schedule preserves fractional event time',
          approx(app.getScheduleFromDOM().boluses[0].time, 0.025));
        check('fractional schedule fields avoid browser step errors', [...input('bolusEventsTable').querySelectorAll('input[type="number"]'), ...input('infusionEventsTable').querySelectorAll('input[type="number"]')].every(el => !el.validity.stepMismatch));
        app.setScheduleToDOM({ enabled: true, boluses: [{ time: 3, dose: 1, duration: 0 }], infusions: [
          { start: 0, end: 0.2, rate: 1 }, { start: 0.1, end: 0.3, rate: 1 }, { start: 0.5, end: 3, rate: 1 }
        ] });
        input('tfinal').value = 2;
        app.dfsolve();
        check('schedule warns about overlaps, gaps, and truncated events', ['overlap', 'gap', 'beyond'].every(word => input('scheduleWarnings').textContent.includes(word)));
        check('schedule warnings do not prevent simulation', input('validationSummary').hidden && !input('scheduleWarnings').hidden);

        app.eval('strategies.at(-1).name = "<img src=x onerror=alert(1)>"');
        app.renderStrategyList();
        check('strategy name is rendered as text', !input('strategyList').querySelector('img'));

        app.applyDrugById('propofol');
        change('mainWeight', '82');
        change('mainFinalTime', '8');
        input('pkInputMode').value = 'microconstants';
        input('pkInputMode').dispatchEvent(new Event('change', { bubbles: true }));
        app.setScheduleToDOM({ enabled: true, boluses: [{ time: 0.025, dose: 0.5, duration: 0.2 }], infusions: [{ start: 0.3, end: 3.75, rate: 80 }] });
        app.disableLegacyBolusInfusionInputs(true);
        app.dfsolve();
        app.setBolusUnit('mg');
        app.setInfusionUnit('mg/hr');
        app.dfsolve();
        app.captureCurrentStrategy();
        const fileState = app.getCurrentState();
        const predictionBefore = app.simulateStrategy(fileState);
        let savedText = '';
        const originalDownload = app.downloadText;
        app.downloadText = (filename, text) => { savedText = text; };
        input('saveRegimenBtn').click();
        app.downloadText = originalDownload;
        check('save button produces a versioned regimen file', JSON.parse(savedText).format === 'physio-regimen' && JSON.parse(savedText).version === 1);
        app.applyDrugById('fentanyl');
        app.loadRegimenDocument(savedText);
        const restoredState = app.getCurrentState();
        check('regimen files restore units, patient, microconstants, and schedule', JSON.stringify(restoredState.units) === JSON.stringify(fileState.units) && JSON.stringify(restoredState.pk) === JSON.stringify(fileState.pk) && JSON.stringify(restoredState.schedule) === JSON.stringify(fileState.schedule) && restoredState.patient.weightKg === 82);
        check('loaded regimens reproduce the model predictions', approx(app.simulateStrategy(restoredState).cp.at(-1), predictionBefore.cp.at(-1)));
        check('comparison strategies survive saving and loading', app.eval('strategies.length') === JSON.parse(savedText).strategies.length);
        const beforeBadLoad = JSON.stringify(app.getCurrentState());
        const corruptFile = JSON.parse(savedText);
        corruptFile.current.schedule.infusions[0].rate = '<img src=x onerror=alert(1)>';
        let rejected = false;
        try { app.loadRegimenDocument(JSON.stringify(corruptFile)); } catch (error) { rejected = true; }
        check('invalid regimen files leave current inputs intact', rejected && JSON.stringify(app.getCurrentState()) === beforeBadLoad);
        const futureFile = JSON.parse(savedText);
        futureFile.version = 99;
        rejected = false;
        try { app.loadRegimenDocument(JSON.stringify(futureFile)); } catch (error) { rejected = true; }
        check('unsupported regimen versions are rejected without changes', rejected && JSON.stringify(app.getCurrentState()) === beforeBadLoad);
        app.setDosingMode('basic');
        const inactiveFile = JSON.stringify(app.buildRegimenDocument());
        app.applyDrugById('fentanyl');
        app.loadRegimenDocument(inactiveFile);
        app.setDosingMode('schedule');
        check('regimen files preserve inactive schedule drafts', JSON.stringify(app.getScheduleFromDOM()) === JSON.stringify(fileState.schedule));
        const transfer = new app.DataTransfer();
        transfer.items.add(new app.File([savedText], 'roundtrip.json', { type: 'application/json' }));
        input('regimenFileInput').files = transfer.files;
        input('regimenFileInput').dispatchEvent(new Event('change', { bubbles: true }));
        for (let tries = 0; tries < 50 && !input('regimenFileStatus').textContent.includes('Loaded roundtrip.json'); tries++) await new Promise(resolve => setTimeout(resolve, 20));
        check('regimen upload uses the validated restore workflow', input('regimenFileStatus').textContent.includes('Loaded roundtrip.json'));

        if (new URLSearchParams(location.search).has('long')) {
          app.applyDrugById('propofol');
          input('tciEnabled').checked = true;
          input('tciEnabled').dispatchEvent(new Event('change', { bubbles: true }));
          const longSource = app.simulateStrategy(app.getCurrentState());
          input('importTciScheduleBtn').click();
          const originalLongCount = app.getScheduleFromDOM().infusions.length;
          check('full-length TCI import creates a schedule', originalLongCount > 100);
          const longReplay = app.simulateStrategy(app.getCurrentState());
          check('full-length imported schedule reproduces the TCI curve',
            approx(longReplay.totalDoseMgKg, longSource.totalDoseMgKg) &&
            longReplay.cp.every((value, index) => approx(value, longSource.cp[index], 1e-6)));
          input('mainEditScheduleBtn').click();
          check('large schedules open in a wider editor with paged infusion rows', input('scheduleEditor').open && input('infusionEventsTable').querySelectorAll('tbody tr:not([hidden])').length === 50);
          input('scheduleNextBtn').click();
          check('schedule pages retain the full dosing regimen', !input('infusionEventsTable').tBodies[0].rows[50].hidden && app.getScheduleFromDOM().infusions.length === originalLongCount);
          input('scheduleJumpTime').value = String(app.getScheduleFromDOM().infusions[200].start);
          input('scheduleJumpBtn').click();
          check('jump to time reveals the matching infusion', !input('infusionEventsTable').tBodies[0].rows[200].hidden);
          let csv = '';
          app.downloadText = (filename, text) => { csv = text; };
          input('scheduleCsvBtn').click();
          app.downloadText = originalDownload;
          check('schedule CSV includes every infusion, not just the visible page', csv.split('\r\n').length === originalLongCount + 1 && csv.includes('weight_kg'));
          input('closeScheduleEditorBtn').click();
          check('closing the schedule editor preserves the drawer controls', !input('scheduleEditor').open && input('paramsDrawer').contains(input('scheduleCard')) && input('infusionEventsTable').querySelectorAll('tbody tr[hidden]').length === 0);
          const importedFile = JSON.stringify(app.buildRegimenDocument());
          app.reset();
          app.loadRegimenDocument(importedFile);
          check('saved imported schedules retain their original TCI comparison', !input('tciReplayComparison').hidden && input('myDiv1').data.some(trace => trace.name === 'Original TCI Cp (model)'));
          input('tciSimplifyLimit').value = '120';
          input('simplifyTciScheduleBtn').click();
          check('full-length TCI schedule can be simplified', app.getScheduleFromDOM().infusions.length <= 120 && app.getScheduleFromDOM().infusions.length < originalLongCount);
        }

        app.reset();
        const frame = document.getElementById('app');
        frame.hidden = false;
        frame.style.cssText = 'width:390px;height:844px;position:absolute;left:-2000px';
        frame.getBoundingClientRect();
        check('mobile controls and chart are near the top', input('mainBolusAmount').getBoundingClientRect().top < 400 && input('myDiv1').getBoundingClientRect().top < 850);
        input('scaleToggleBtnTop').focus();
        input('drawerCloseBtn').focus();
        check('closed drawer cannot receive keyboard focus', app.document.activeElement.id === 'scaleToggleBtnTop');
        document.body.dataset.result = 'passed';
      } catch (error) {
        checks.push({ name: error.message, passed: false });
        document.body.dataset.result = 'failed';
      }
      results.textContent = checks.map(item => `${item.passed ? 'PASS' : 'FAIL'} ${item.name}`).join('\n');
    });
  </script>
</body>
</html>
